# ? This is a template used for experimenting with the Arrow format.
# ? Its not representative of what Quiver recognizes as an Arrow.

manifest: "arrow@v1"  # ? The arrow prefix identifies that this is
                      # ? a arrow package, on the v1 version

metadata:
  version: 25.7.0
  license: MIT
  quiver_url: https://quiver.ar/quiver/quiver.yaml
  
  name: quiver.chat
  description: Quiver Chat is a chat client for the Quiver platform.

  media: 
    icon: https://quiver.ar/quiver/icon.png
    banner: https://quiver.ar/quiver/banner.png
  
  credits:
    - name: char2cs
      email: info@char2cs.net
      url: https://char2cs.net

requirements:
  cpu_cores: 1
  ram_gb: 1
  disk_gb: 1
  network_mbps: 1

netbridge: 
  - name: "CHAT_PORT"
    protocol: "tcp/udp"

variables:
  - name: "QUIVER_CHAT_HOSTNAME"
    default: "chat.quiver.ar"
    sensitive: false

dependencies:
 - "github/char2cs/char2cs.quiver:steamcmd"

runtime:
  - platforms: 
      - "linux/amd64"
      - "linux/arm64"
      - "darwin/amd64"
      - "darwin/arm64"
    methods:
      - name: "install"
        actions:
          - cmd: "curl -fsSL https://quiver.ar/quiver/install.sh | bash"
            on_failure: error
          - cmd: "./quiver"
      - name: "update"
        actions:
          - "curl -fsSL https://quiver.ar/quiver/update.sh | bash"
      - name: "uninstall"
        actions:
          - "curl -fsSL https://quiver.ar/quiver/uninstall.sh | bash"
      - name: "run"
        actions:
          - "./quiver"
