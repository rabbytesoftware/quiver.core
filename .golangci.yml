version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - nakedret
    - nestif
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    govet:
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    nestif:
      min-complexity: 2
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
    revive:
      enable-all-rules: false
      rules:
        - name: early-return
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
          - gocyclo
        path: _test\.go
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - gosec
        text: 'G404:'
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^docs/swagger
      - ^\.\./
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
severity:
  default: error
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/rabbytesoftware/quiver
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
