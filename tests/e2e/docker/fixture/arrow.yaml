schema: "arrow@v0"

# Served from a container-local git host under a rolling tag the suite
# force-moves. run.sh rewrites build-N to build-N+1 in each moved commit, so
# the workdir markers prove which revision's steps actually ran. The update
# step takes seconds, so a CLI that returned before it finished would show.
metadata:
  name: e2e.rolling-tool
  description: Rolling-tag fixture whose steps record the ref and build they ran for

targets:
  "linux/*":
    lifecycle:
      install:
        - type: run
          title: Install
          command: echo "${REF}" > "${WORKDIR}/install-ref"; echo build-1 > "${WORKDIR}/build"; echo kept > "${WORKDIR}/user-data"
          timeout: 10s
          exit_on_failure: true

      update:
        - type: run
          title: Update
          command: sleep 3; echo "${REF}" >> "${WORKDIR}/update-refs"; echo build-1 > "${WORKDIR}/build"
          timeout: 30s
          exit_on_failure: true

      uninstall:
        - type: run
          title: Uninstall
          command: rm -f "${WORKDIR}/install-ref" "${WORKDIR}/build" "${WORKDIR}/update-refs" "${WORKDIR}/user-data"
          timeout: 10s
          exit_on_failure: false
