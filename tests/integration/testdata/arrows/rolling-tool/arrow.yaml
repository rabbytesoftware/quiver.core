schema: "arrow@v0"
metadata:
  name: quiver-test.rolling-tool
  description: Rolling-tag tool whose update steps record the ref they ran for
targets:
  "*":
    lifecycle:
      install:
        - type: run
          command: echo installed > "${WORKDIR}/install-marker"
          title: Install
          timeout: 10s
          exit_on_failure: true
      update:
        - type: run
          command: echo update-ran >> "${WORKDIR}/events"; if [ -f "${WORKDIR}/hold" ]; then while [ ! -f "${WORKDIR}/release" ]; do sleep 0.05; done; rm -f "${WORKDIR}/hold" "${WORKDIR}/release"; fi; echo "${REF}" >> "${WORKDIR}/update-refs"
          title: Update
          timeout: 120s
          exit_on_failure: true
      execute:
        - type: run
          command: echo $$ > "${WORKDIR}/serve.pid"; trap 'echo stop-signalled >> "${WORKDIR}/events"; exit 0' TERM; sleep 3600 & wait
          title: Serve
          timeout: 3700s
          exit_on_failure: false
      stop:
        - type: run
          command: sleep 1
          title: Drain
          timeout: 10s
          exit_on_failure: false
        - type: signal
          signal: graceful
          timeout: 10s
          exit_on_failure: false
      uninstall:
        - type: run
          command: echo uninstalled
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
