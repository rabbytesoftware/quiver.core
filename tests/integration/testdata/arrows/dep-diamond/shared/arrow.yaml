schema: "arrow@v0"
metadata:
  name: quiver-test.dep-diamond-shared
  description: Diamond dependency shared
targets:
  "*":
    lifecycle:
      install:
        - type: run
          command: echo installed-shared
          title: Install
          timeout: 10s
          exit_on_failure: true
      uninstall:
        - type: run
          command: echo uninstalled-shared
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
