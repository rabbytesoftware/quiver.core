schema: "arrow@v0"
metadata:
  name: quiver-test.tool-netbridge-b
  description: Arrow declaring netbridge port 9000 (conflict pair with tool-netbridge-a)
netbridge:
  - name: api
    protocol: tcp
    default: 9000
    required: true
targets:
  "*":
    lifecycle:
      install:
        - type: run
          command: echo installed-b
          title: Install
          timeout: 10s
          exit_on_failure: true
      uninstall:
        - type: run
          command: echo uninstalled-b
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
