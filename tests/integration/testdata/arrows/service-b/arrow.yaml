schema: "arrow@v0"
metadata:
  name: quiver-test.service-b
  description: Service with netbridge port
netbridge:
  - name: TEST_PORT
    protocol: tcp
    default: 9000
    required: false
targets:
  "*":
    lifecycle:
      install:
        - type: run
          command: echo installed-service-b
          title: Install
          timeout: 10s
          exit_on_failure: true
      execute:
        - type: run
          command: sleep 3600
          title: Execute
          timeout: 3700s
          exit_on_failure: false
      stop:
        - type: signal
          signal: graceful
          timeout: 10s
          exit_on_failure: false
      uninstall:
        - type: run
          command: echo uninstalled-service-b
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
