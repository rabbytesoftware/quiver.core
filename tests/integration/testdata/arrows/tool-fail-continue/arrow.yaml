schema: "arrow@v0"
metadata:
  name: quiver-test.tool-fail-continue
  description: Tool where step 1 fails but install continues
targets:
  "*":
    lifecycle:
      install:
        - type: run
          command: exit 1
          title: Failing Step
          timeout: 10s
          exit_on_failure: false
        - type: run
          command: echo step-2-ok
          title: Continuing Step
          timeout: 10s
          exit_on_failure: true
      uninstall:
        - type: run
          command: echo uninstalled-fail-continue
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
