schema: "arrow@v0"
metadata:
  name: quiver-test.dep-chain-i
  version: 1.0.0
  description: Dependency chain letter i
targets:
  "*":
    tools:
      - quiver.test/dep-chain/j@v1
    lifecycle:
      install:
        - type: run
          command: echo installed-i
          title: Install
          timeout: 10s
          exit_on_failure: true
      uninstall:
        - type: run
          command: echo uninstalled-i
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
