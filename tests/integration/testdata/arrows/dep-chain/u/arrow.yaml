schema: "arrow@v0"
metadata:
  name: quiver-test.dep-chain-u
  version: 1.0.0
  description: Dependency chain letter u
targets:
  "*":
    tools:
      - quiver.test/dep-chain/v@v1
    lifecycle:
      install:
        - type: run
          command: echo installed-u
          title: Install
          timeout: 10s
          exit_on_failure: true
      uninstall:
        - type: run
          command: echo uninstalled-u
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
