schema: "arrow@v0"
metadata:
  name: quiver-test.dep-chain-q
  version: 1.0.0
  description: Dependency chain letter q
targets:
  "*":
    tools:
      - quiver.test/dep-chain/r@v1
    lifecycle:
      install:
        - type: run
          command: echo installed-q
          title: Install
          timeout: 10s
          exit_on_failure: true
      uninstall:
        - type: run
          command: echo uninstalled-q
          title: Uninstall
          timeout: 10s
          exit_on_failure: false
