# ? Template: Service Arrow (long-running process)
# ? Example: CS2 Dedicated Game Server
# ? Lifecycle: absent → ready → running → stopped → removed

schema: "arrow@v0"

metadata:
        name: valve.cs2-server
        description: Counter-Strike 2 Dedicated Server
        version: 25.11.0
        license: MIT
        quiver: github.com/rabbytesoftware/quiver.experiments

        media:
                icon: https://quiver.ar/valve/cs2/icon.png
                banner: https://quiver.ar/valve/cs2/banner.png

        credits:
                - name: char2cs
                  email: me@char2cs.net
                  url: https://char2cs.net

# ─── System requirements ───

requirements:
        cpu_cores: 2
        ram_gb: 8
        disk_gb: 60

# ─── Dependencies: other Arrows this Arrow needs ───

dependencies:
        - github.com/rabbytesoftware/quiver.experiments/steamcmd

# ─── Variables: configurable by the user ───

variables:
        - name: CS2_MAXPLAYERS
          default: "16"
          sensitive: false

        - name: CS2_MAP
          default: "de_dust2"
          options: ["de_mirage", "de_inferno", "de_dust2", "de_nuke"]
          sensitive: false

        - name: CS2_RCON_PASSWORD
          sensitive: true

netbridge:
        - name: CS2_PORT
          default: "27015"
          protocol: "tcp/udp"
          sensitive: false

# ─── Lifecycle: platform-managed state transitions ───
#
#   install:    absent  → ready
#   execute:    ready   → running    (declares this Arrow as a service)
#   stop:       running → stopped    (required when execute is defined)
#   uninstall:  *       → removed    (optional, platform cleans workdir by default)

lifecycle:
        install:
                - type: run
                  command: "${quiver.steamcmd} +app_update 730 validate +quit"
                  title: "Installing CS2 via SteamCMD"
                  timeout: 30m

                - type: run
                  command: "./setup_config.sh --map ${CS2_MAP} --maxplayers ${CS2_MAXPLAYERS}"
                  title: "Configuring server"

        execute:
                - type: run
                  command: "./srcds_run -game csgo -port ${CS2_PORT} -maxplayers ${CS2_MAXPLAYERS} +map ${CS2_MAP}"
                  title: "Starting CS2 server"

        stop:
                - type: signal
                  signal: SIGTERM
                  timeout: 30s

        uninstall:
                - type: run
                  command: "./cleanup.sh"
                  title: "Cleaning up server files"

# ─── Methods: developer-defined actions, no state transitions ───
#
#   available_in: which lifecycle states this method can be invoked in
#   steps:        sequential list of actions to execute

methods:
        update:
                available_in: [ready]
                steps:
                        - type: run
                          command: "${valve.steamcmd} +app_update 730 validate +quit"
                          title: "Updating CS2"
                          timeout: 30m

        validate:
                available_in: [ready]
                steps:
                        - type: run
                          command: "${valve.steamcmd} +app_validate 730 +quit"
                          title: "Validating game files"

        change-map:
                available_in: [running]
                steps:
                        - type: run
                          command: "./rcon.sh changelevel ${CS2_MAP}"
                          title: "Changing map"

        backup:
                available_in: [ready]
                steps:
                        - type: run
                          command: "./backup.sh --output ${WORKDIR}/backups/"
                          title: "Backing up server data"
