# ? Template: Quiver (Store / Catalog)
# ? Example: Gaming Quiver — curated catalog of game servers and utilities
# ? A Quiver is a collection of pointers to Arrows. It does not own them.

schema: "quiver@v0"

# ─── Metadata ───

name: "Gaming Quiver"
description: "Game servers and utilities curated by char2cs"
url: "https://gaming.quiver.ar"

maintainers:
  - "char2cs"

tags:
  - "gaming"
  - "servers"

media:
  icon: "https://example.com/icon.png"
  banner: "https://example.com/banner.png"

# ─── Arrow catalog ───
#
#   Simple name  → local Arrow (YAML file in this repo)
#                  Namespaced as: github.com/{owner}/{repo}/{name}
#
#   Full URL     → external Arrow (pointer, not re-namespaced)
#                  Keeps its own namespace, Quiver just references it

arrows:
  # Local arrows (files in this repo)
  - cs2                                    # → github.com/rabbytesoftware/gaming.quiver/cs2
  - minecraft                              # → github.com/rabbytesoftware/gaming.quiver/minecraft

  # External arrows (pointers to other repos/quivers)
  - github.com/valve/steamcmd              # standalone Arrow
  - github.com/valve/quiver/steamcmd       # Arrow inside another Quiver
