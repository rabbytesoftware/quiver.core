# ? Template: Quiver (Store / Catalog)
# ? Example: Gaming Quiver — curated catalog of game servers and utilities
# ? A Quiver is a collection of pointers to Arrows. It does not own them.

schema: "quiver@v0"

# ─── Metadata ───

metadata:
  name: "Gaming Quiver"
  description: "Game servers and utilities curated by char2cs"
  url: "https://gaming.quiver.ar"

  maintainers:
    - "char2cs"

  tags:
    - "gaming"
    - "servers"

  media:
    icon: "https://example.com/icon.png"
    banner: "https://example.com/banner.png"

# ─── Arrow catalog ───
#
#   path: cs2          → local Arrow in this repo at path "cs2"
#                        Namespaced as: {owner}/{repo}/cs2
#
#   namespace: foo/bar → explicit external namespace (used as-is)

arrows:
  # Local arrows (YAML files in this repo, under a subdirectory)
  - path: cs2                              # → github.com/rabbytesoftware/gaming.quiver/cs2
  - path: minecraft                        # → github.com/rabbytesoftware/gaming.quiver/minecraft

  # External arrows (explicit full namespace)
  - namespace: github.com/valve/steamcmd
