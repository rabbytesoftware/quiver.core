    - ProtocolUDP
    - ProtocolTCPUDP
host: localhost:40257
info:
  contact:
    name: Rabbyte Software
  description: Quiver is a decentralized package manager.
  title: Quiver API
  version: "0"
paths:
  /arrow:
    get:
      description: Returns all registered arrows. Use the WebSocket upgrade to stream
        real-time updates instead.
      parameters:
      - description: Filter by user-installed flag
        in: query
        name: user_installed
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.ArrowListItemDTO'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: List arrows
      tags:
      - arrows
  /arrow/{ns}:
    delete:
      description: Deregisters an arrow. The namespace must include a @ref (version)
        qualifier.
      parameters:
      - description: Versioned arrow namespace (e.g. github.com/user/repo@v1.0.0)
        in: path
        name: ns
        required: true
        type: string
      responses:
        "200":
          description: Arrow removed
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.MutationResponse'
        "400":
          description: Namespace missing @ref
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "404":
          description: Arrow not found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Remove arrow
      tags:
      - arrows
    get:
      description: Returns detailed information for an arrow including current state,
        active run, and last return. Use the WebSocket upgrade to stream live updates.
      parameters:
      - description: Arrow namespace
        in: path
        name: ns
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.ArrowDetailDTO'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Get arrow detail
      tags:
      - arrows
    patch:
      consumes:
      - application/json
      description: Fetches the latest manifest for the arrow and updates its registration.
      parameters:
      - description: Arrow namespace
        in: path
        name: ns
        required: true
        type: string
      responses:
        "200":
          description: Arrow updated
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.MutationResponse'
        "404":
          description: Arrow not found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Update arrow manifest
      tags:
      - arrows
    post:
      description: Registers an arrow by its namespace. The manifest must already
        exist in the registry.
      parameters:
      - description: Arrow namespace (e.g. github.com/user/repo@v1.0.0)
        in: path
        name: ns
        required: true
        type: string
      responses:
        "201":
          description: Arrow registered
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.MutationResponse'
        "400":
          description: Invalid namespace
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "404":
          description: Manifest not found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "409":
          description: Arrow already registered
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Register arrow
      tags:
      - arrows
  /arrow/{ns}/manifest:
    get:
      description: Returns the full manifest definition including targets, variables,
        and lifecycle steps.
      parameters:
      - description: Arrow namespace
        in: path
        name: ns
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.ArrowManifestDTO'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Get arrow manifest
      tags:
      - arrows
    post:
      consumes:
      - application/x-yaml
      description: Accepts a raw YAML manifest in the request body, stores it in the
        registry, and registers the arrow. Use this to publish a new arrow from a
        local manifest file.
      parameters:
      - description: Arrow namespace
        in: path
        name: ns
        required: true
        type: string
      - description: Raw YAML manifest
        in: body
        name: body
        required: true
        schema:
          type: string
      responses:
        "201":
          description: Manifest seeded and arrow registered
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.MutationResponse'
        "400":
          description: Failed to read body
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "422":
          description: Invalid manifest
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Seed arrow manifest
      tags:
      - arrows
  /arrow/{ns}/manifest/validate:
    post:
      consumes:
      - application/x-yaml
      description: Parses and validates a raw YAML manifest. Returns validation errors
        and platform compatibility without writing anything to the registry.
      parameters:
      - description: Arrow namespace
        in: path
        name: ns
        required: true
        type: string
      - description: Raw YAML manifest
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Manifest is valid
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.ValidationResultDTO'
              type: object
        "400":
          description: Failed to read body
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "422":
          description: Manifest has validation errors
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.ValidationResultDTO'
              type: object
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Validate arrow manifest
      tags:
      - arrows
  /health:
    get:
      description: Returns {"status":"ok"} when the daemon is running.
      produces:
      - application/json
      responses:
        "200":
          description: Daemon is healthy
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /quiver:
    get:
      description: Returns quiver collections. Use ?followed=true for followed only,
        ?followed=false for unfollowed cached, or omit for all.
      parameters:
      - description: Filter by followed status
        in: query
        name: followed
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.CollectionListItemDTO'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: List quivers
      tags:
      - quivers
  /quiver/{ns}:
    get:
      description: Returns detailed information for a quiver including its arrows
        and follow status.
      parameters:
      - description: Quiver namespace
        in: path
        name: ns
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.QueryResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_v0_dto.CollectionDetailDTO'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Get quiver
      tags:
      - quivers
  /quiver/{ns}/follow:
    delete:
      description: Stops following a quiver collection.
      parameters:
      - description: Quiver namespace
        in: path
        name: ns
        required: true
        type: string
      responses:
        "200":
          description: Quiver unfollowed
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.MutationResponse'
        "404":
          description: Quiver not followed
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Unfollow quiver
      tags:
      - quivers
    post:
      description: Follows a quiver collection and caches its arrows locally.
      parameters:
      - description: Quiver namespace
        in: path
        name: ns
        required: true
        type: string
      responses:
        "201":
          description: Quiver followed
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.MutationResponse'
        "404":
          description: Quiver not found
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "409":
          description: Already following
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/github_com_rabbytesoftware_quiver_internal_api_libs.ErrResponse'
      summary: Follow quiver
      tags:
      - quivers
  /quiver/{ns}/manifest:
    get:
      description: Returns the raw cached manifest for a quiver.
      parameters:
      - description: Quiver namespace
        in: path
        name: ns
        required: true
