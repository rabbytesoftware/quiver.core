basePath: /v0
consumes:
- application/json
definitions:
  github_com_rabbytesoftware_quiver_core_internal_api_libs.ErrResponse:
    properties:
      error:
        type: string
      namespace:
        type: string
      success:
        type: boolean
    type: object
  github_com_rabbytesoftware_quiver_core_internal_api_libs.MutationResponse:
