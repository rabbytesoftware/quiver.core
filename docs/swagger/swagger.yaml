host: localhost:40257
info:
  contact:
    name: Rabbyte Software
  description: Quiver is a decentralized package manager.
  title: Quiver API
  version: "0"
paths:
  /arrow:
    get:
      description: Returns all registered arrows. Use the WebSocket upgrade to stream
        real-time updates instead.
      parameters:
      - description: Filter by user-installed flag
        in: query
        name: user_installed
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rabbytesoftware_quiver_core_internal_api_libs.QueryResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_rabbytesoftware_quiver_core_internal_api_v0_dto.ArrowListItemDTO'
                  type: array
