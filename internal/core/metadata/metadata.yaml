# ? Metadata is a collection of variables that
# ? are used throughout the project for:
# ?  - Describe things
# ?  - Set defaults variables (config relative paths, etc)
# ?  - Versioning, credits, maintainers, etc

version:
  number: 25.9.0
  codename: "Freeman"

metadata:
  name: Quiver
  description: The future of wizards and package managers.
  author: Rabbyte Software
  url: https://quiver.ar
  license: GPL-3.0
  copyright: Copyright 2025 Rabbyte Software & char2cs.net
  maintainers:
    - name: Mateo Urrutia
      email: me@char2cs.net
      url: https://char2cs.net
    - name: Agustin Gil
      email:
      url: https://github.com/AgustinGil21
    - name: Luca Lombardo
      email:
      url: https://github.com/Lucacux

paths:
  home:
    default: "~/.quiver"
    windows: 'C:\Users\{{USER}}\Documents\.quiver'
  events: "{{home}}/state/events"
  store: "{{home}}/state/store"
  namespaces: "{{home}}/namespaces"
  config: "{{home}}/config.yaml"
  logs: "{{home}}/logs"
  vault: "{{home}}/vault"

# ? discovery.topics are the repository markers that make a repo an arrow
# ? candidate. It is a list so new markers can be added without a schema change.
discovery:
  topics:
    - quiver-arrow

# ? A platform without search_url has no usable topic-search API and stays
# ? fetch-only: it is never turned into a discovery provider.
# ? latest_release_url is read for its redirect Location only, so it costs no
# ? API quota. A platform without one falls back to listing git tags.
platforms:
  github.com:
    raw_url: "https://raw.githubusercontent.com/{user}/{repo}/{branch}/{file}"
    default_branches: [main, master]
    latest_release_url: "https://github.com/{user}/{repo}/releases/latest"
    search_url: "https://api.github.com/search/repositories?q={query}"
    search_kind: github
  gitlab.com:
    raw_url: "https://gitlab.com/{user}/{repo}/-/raw/{branch}/{file}"
    default_branches: [main, master]
    latest_release_url: "https://gitlab.com/{user}/{repo}/-/releases/permalink/latest"
    search_url: "https://gitlab.com/api/v4/projects?search={query}&topic={topic}"
    search_kind: gitlab
  bitbucket.org:
    raw_url: "https://bitbucket.org/{user}/{repo}/raw/{branch}/{file}"
    default_branches: [main, master]
