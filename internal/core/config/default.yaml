# ? The default config are a collection of variables that
# ? can be changed by the user on runtime, but these remain
# ? as defaults when either not present or empty.

config:
  netbridge:
    enabled: true
    ephemeral_port_start: 49152
    ephemeral_port_end: 65535

  api:
    host: unix://

  logger:
    enabled: true
    level: info

  manifold:
    fetch_timeout: 30s

  vault:
    sweep_interval: 5m
    ttl: 24h
    index_ttl: 720h

  arrows:
    auto_retry:
      enabled: true
      retries: 3

  # ? token is optional. It raises the git-host search rate limit and makes the
  # ? budget per-account rather than per-IP, which matters for developers behind
  # ? one corporate NAT. No Quiver account is involved.
  search:
    token: ""
    per_provider_limit: 25
    fetch_concurrency: 8
    provider_timeout: 10s
