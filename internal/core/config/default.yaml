# ? The default config are a collection of variables that
# ? can be changed by the user on runtime, but these remain
# ? as defaults when either not present or empty.

config:
  # ? enabled controls router port forwarding (UPnP/NAT-PMP) only. Turning it
  # ? off still allocates ports for arrows that serve; it just stops Quiver
  # ? from asking the router to open them, and skips discovery at startup.
  netbridge:
    enabled: true
    ephemeral_port_start: 49152
    ephemeral_port_end: 65535

  api:
    host: unix://

  logger:
    enabled: true
    level: info

  manifold:
    fetch_timeout: 30s

  vault:
    sweep_interval: 5m
    ttl: 24h
    index_ttl: 720h

  arrows:
    auto_retry:
      enabled: true
      retries: 3

  # ? Pairing codes authenticate quiver.desktop when the daemon is reachable
  # ? over tcp://. Unix socket connections are already trusted and never use
  # ? this. redeem_rate_limit/window throttle the redeem endpoint globally,
  # ? since a wrong guess never touches a real pairing code's own record and
  # ? so cannot be rate-limited per-code.
  auth:
    pairing_code_ttl: 5m
    redeem_rate_limit: 5
    redeem_rate_window: 1m

  # ? Discovery is anonymous. Quiver authenticates to no git host and asks for
  # ? no credentials, so these are the only knobs: how many candidates to take
  # ? per provider, how many manifests to verify at once, and when to give up.
  search:
    per_provider_limit: 25
    fetch_concurrency: 8
    provider_timeout: 10s
