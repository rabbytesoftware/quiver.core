# ? The default config are an collection of variables that
# ? can be changed by the user on runtime, but these remain
# ? as defaults when its either no present or empty.

config:
  netbridge:
    enabled: true
    ephemeral_port_start: 49152
    ephemeral_port_end: 65535

  arrows:
    repositories:
      - ./pkgs
      - https://raw.githubusercontent.com/rabbytesoftware/quiver.arrows/main
    install_dir: ./arrows

  api:
    host: 0.0.0.0
    port: 40257

  database:
    path: ./db

  watcher:
    enabled: true
    level: info
    folder: ./logs
    max_size: 100
    max_age: 7
    compress: true
