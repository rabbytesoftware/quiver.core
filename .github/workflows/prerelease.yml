name: Pre-release

on:
  push:
    branches:
      - 'beta/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      channel: ${{ steps.tag.outputs.CHANNEL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Derive pre-release tag
      id: tag
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        case "$BRANCH" in
          beta/*) CHANNEL="beta" ;;
          hotfix/*) CHANNEL="hotfix" ;;
          *)
            echo "❌ Unrecognized branch pattern: ${BRANCH}"
            exit 1
            ;;
        esac
        TAG=$(git tag -l | .github/scripts/release-tag.sh prerelease "$BRANCH")

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "CHANNEL=${CHANNEL}" >> "$GITHUB_OUTPUT"
        echo "Computed pre-release tag: ${TAG}"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-assets.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.tag }}
      channel: ${{ needs.prepare.outputs.channel }}

  publish:
    name: Publish Pre-release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Download release assets
      uses: actions/download-artifact@v8
      with:
        name: release-assets
        path: bin

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 --exclude='nightly*' HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Pre-release" > CHANGELOG.md
        fi

    - name: Publish pre-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        # The tag must name the commit that was built (build-assets checks out
        # github.sha and stamps it as main.commit); without --target GitHub
        # creates it at the default branch's head instead.
        gh release create "$TAG" \
          --prerelease \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes-file CHANGELOG.md \
          bin/quiver-linux-amd64 \
          bin/quiver-linux-arm64 \
          bin/quiver-darwin-amd64 \
          bin/quiver-darwin-arm64 \
          bin/quiver-windows-amd64.exe \
          bin/checksums.txt

    - name: Comment release on PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
        BRANCH: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        PR=$(gh pr list --head "$BRANCH" --base master --json number --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$PR" ] && [ "$PR" != "null" ]; then
          gh pr comment "$PR" --body "Pre-release [**${TAG}**](https://github.com/${REPO}/releases/tag/${TAG}) has been published."
        fi
