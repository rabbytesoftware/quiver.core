name: Pre-release

on:
  push:
    branches:
      - 'beta/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Derive pre-release tag
      id: tag
      env:
        BRANCH: ${{ github.ref_name }}
      run: |

        if [[ "$BRANCH" == beta/* ]]; then
          SERIES="${BRANCH#beta/}"
          COUNT=$(git tag -l "beta-${SERIES}" "beta-${SERIES}-*" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq "0" ]; then
            TAG="beta-${SERIES}"
          else
            TAG="beta-${SERIES}-${COUNT}"
          fi

        elif [[ "$BRANCH" == hotfix/* ]]; then
          LATEST=$(git tag -l "stable-*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No stable baseline found. A hotfix requires an existing stable release."
            exit 1
          fi
          VERSION="${LATEST#stable-}"
          PARTS=$(echo "$VERSION" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$PARTS" -eq "2" ]; then
            HOTFIX_VERSION="${VERSION}.1"
          else
            BASE=$(echo "$VERSION" | cut -d'.' -f1,2)
            PATCH=$(echo "$VERSION" | cut -d'.' -f3)
            HOTFIX_VERSION="${BASE}.$((PATCH + 1))"
          fi
          COUNT=$(git tag -l "hotfix-${HOTFIX_VERSION}" "hotfix-${HOTFIX_VERSION}-*" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq "0" ]; then
            TAG="hotfix-${HOTFIX_VERSION}"
          else
            TAG="hotfix-${HOTFIX_VERSION}-${COUNT}"
          fi
        else
          echo "❌ Unrecognized branch pattern: ${BRANCH}"
          exit 1
        fi

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed pre-release tag: ${TAG}"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-assets.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.tag }}

  publish:
    name: Publish Pre-release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Download release assets
      uses: actions/download-artifact@v8
      with:
        name: release-assets
        path: bin

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 --exclude=nightly HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Pre-release" > CHANGELOG.md
        fi

    - name: Publish pre-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        gh release create "$TAG" \
          --prerelease \
          --title "$TAG" \
          --notes-file CHANGELOG.md \
          bin/quiver-linux-amd64 \
          bin/quiver-linux-arm64 \
          bin/quiver-darwin-amd64 \
          bin/quiver-darwin-arm64 \
          bin/quiver-windows-amd64.exe \
          bin/checksums.txt

    - name: Comment release on PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
        BRANCH: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        PR=$(gh pr list --head "$BRANCH" --base master --json number --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$PR" ] && [ "$PR" != "null" ]; then
          gh pr comment "$PR" --body "Pre-release [**${TAG}**](https://github.com/${REPO}/releases/tag/${TAG}) has been published."
        fi
