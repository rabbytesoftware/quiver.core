name: Pre-release

on:
  push:
    branches:
      - 'beta/**'
      - 'hotfix/**'

env:
  GO_VERSION: '1.26'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-prerelease:
    name: Create Pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: Derive pre-release tag
      id: tag
      env:
        BRANCH: ${{ github.ref_name }}
      run: |

        if [[ "$BRANCH" == beta/* ]]; then
          SERIES="${BRANCH#beta/}"
          COUNT=$(git tag -l "beta-${SERIES}" "beta-${SERIES}-*" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq "0" ]; then
            TAG="beta-${SERIES}"
          else
            TAG="beta-${SERIES}-${COUNT}"
          fi

        elif [[ "$BRANCH" == hotfix/* ]]; then
          LATEST=$(git tag -l "stable-*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No stable baseline found. A hotfix requires an existing stable release."
            exit 1
          fi
          VERSION="${LATEST#stable-}"
          PARTS=$(echo "$VERSION" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$PARTS" -eq "2" ]; then
            HOTFIX_VERSION="${VERSION}.1"
          else
            BASE=$(echo "$VERSION" | cut -d'.' -f1,2)
            PATCH=$(echo "$VERSION" | cut -d'.' -f3)
            HOTFIX_VERSION="${BASE}.$((PATCH + 1))"
          fi
          COUNT=$(git tag -l "hotfix-${HOTFIX_VERSION}" "hotfix-${HOTFIX_VERSION}-*" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq "0" ]; then
            TAG="hotfix-${HOTFIX_VERSION}"
          else
            TAG="hotfix-${HOTFIX_VERSION}-${COUNT}"
          fi
        else
          echo "❌ Unrecognized branch pattern: ${BRANCH}"
          exit 1
        fi

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed pre-release tag: ${TAG}"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build for multiple platforms
      run: |
        mkdir -p bin
        QUIVER_EPOCH=1775932380
        BUILD_ID=$(( ($(date +%s) - QUIVER_EPOCH) / 86400 ))
        TAG="${{ steps.tag.outputs.TAG }}"
        LDFLAGS="-X main.version=${TAG} -X main.buildID=${BUILD_ID}"

        GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags "$LDFLAGS" -o bin/quiver-linux-amd64       ./cmd/quiver
        GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags "$LDFLAGS" -o bin/quiver-linux-arm64       ./cmd/quiver
        GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags "$LDFLAGS" -o bin/quiver-darwin-amd64      ./cmd/quiver
        GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags "$LDFLAGS" -o bin/quiver-darwin-arm64      ./cmd/quiver
        GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags "$LDFLAGS" -o bin/quiver-windows-amd64.exe ./cmd/quiver

    - name: Generate checksums
      run: |
        cd bin
        sha256sum ./* > checksums.txt
        cat checksums.txt

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Pre-release" > CHANGELOG.md
        fi

    - name: Publish pre-release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.tag.outputs.TAG }}
        name: ${{ steps.tag.outputs.TAG }}
        body_path: CHANGELOG.md
        prerelease: true
        files: |
          bin/quiver-linux-amd64
          bin/quiver-linux-arm64
          bin/quiver-darwin-amd64
          bin/quiver-darwin-arm64
          bin/quiver-windows-amd64.exe
          bin/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
