name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: '1.24.2'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build for multiple platforms
      run: |
        mkdir -p bin
        QUIVER_EPOCH=1775932380
        BUILD_ID=$(expr \( $(date +%s) - $QUIVER_EPOCH \) / 86400)
        LDFLAGS="-X main.version=${{ steps.version.outputs.VERSION }} -X main.buildID=$BUILD_ID"

        echo "Building Linux amd64..."
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -a -installsuffix cgo \
          -ldflags "$LDFLAGS" \
          -o bin/quiver-linux-amd64 ./cmd/quiver

        echo "Building Linux arm64..."
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -a -installsuffix cgo \
          -ldflags "$LDFLAGS" \
          -o bin/quiver-linux-arm64 ./cmd/quiver

        echo "Building macOS amd64..."
        GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -a -installsuffix cgo \
          -ldflags "$LDFLAGS" \
          -o bin/quiver-darwin-amd64 ./cmd/quiver

        echo "Building macOS arm64..."
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -a -installsuffix cgo \
          -ldflags "$LDFLAGS" \
          -o bin/quiver-darwin-arm64 ./cmd/quiver

        echo "Building Windows amd64..."
        GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -a -installsuffix cgo \
          -ldflags "$LDFLAGS" \
          -o bin/quiver-windows-amd64.exe ./cmd/quiver

        echo "Build complete! Created binaries:"
        ls -lh bin/
    
    - name: Generate checksums
      run: |
        cd bin
        sha256sum * > checksums.txt
        cat checksums.txt
    
    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since $PREV_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Release" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "First release of Quiver - Multi-platform, multi-paradigm package manager" >> CHANGELOG.md
        fi
        
        echo "" >> CHANGELOG.md
        echo "## Binaries" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "Download the appropriate binary for your platform:" >> CHANGELOG.md
        echo "- **Linux (amd64)**: \`quiver-linux-amd64\`" >> CHANGELOG.md
        echo "- **Linux (arm64)**: \`quiver-linux-arm64\`" >> CHANGELOG.md
        echo "- **macOS (Intel)**: \`quiver-darwin-amd64\`" >> CHANGELOG.md
        echo "- **macOS (Apple Silicon)**: \`quiver-darwin-arm64\`" >> CHANGELOG.md
        echo "- **Windows (amd64)**: \`quiver-windows-amd64.exe\`" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "See \`checksums.txt\` for SHA256 checksums." >> CHANGELOG.md
        
        cat CHANGELOG.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/quiver-linux-amd64
          bin/quiver-linux-arm64
          bin/quiver-darwin-amd64
          bin/quiver-darwin-arm64
          bin/quiver-windows-amd64.exe
          bin/checksums.txt
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Release complete
      run: |
        echo "Release ${{ steps.version.outputs.VERSION }} created successfully!"
        echo "Binaries are now available for download."

