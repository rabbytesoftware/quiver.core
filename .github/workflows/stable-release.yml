name: Stable Release

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Stable Release
    runs-on: ubuntu-latest
    if: "github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'beta/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))"
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.TAG }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Derive stable tag
      id: tag
      env:
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        SOURCE="$HEAD_REF"

        if [[ "$SOURCE" == beta/* ]]; then
          BRANCH_VERSION="${SOURCE#beta/}"
          SERIES=$(echo "$BRANCH_VERSION" | cut -d'.' -f1,2)
        elif [[ "$SOURCE" == hotfix/* ]]; then
          LATEST=$(git tag -l "stable-*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No stable baseline found. A hotfix requires an existing stable release."
            exit 1
          fi
          VERSION="${LATEST#stable-}"
          SERIES=$(echo "$VERSION" | cut -d'.' -f1,2)
        fi

        LATEST_IN_SERIES=$(git tag -l "stable-${SERIES}" "stable-${SERIES}.*" | sort -V | tail -1)

        if [ -z "$LATEST_IN_SERIES" ]; then
          TAG="stable-${SERIES}"
        else
          PATCH_VERSION="${LATEST_IN_SERIES#stable-}"
          PARTS=$(echo "$PATCH_VERSION" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$PARTS" -eq "2" ]; then
            TAG="stable-${PATCH_VERSION}.1"
          else
            BASE=$(echo "$PATCH_VERSION" | cut -d'.' -f1,2)
            PATCH=$(echo "$PATCH_VERSION" | cut -d'.' -f3)
            TAG="stable-${BASE}.$((PATCH + 1))"
          fi
        fi

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed stable tag: ${TAG}"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-assets.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish Stable Release
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Download release assets
      uses: actions/download-artifact@v8
      with:
        name: release-assets
        path: bin

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 --exclude=nightly HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Release" > CHANGELOG.md
        fi

    - name: Create and push stable tag
      run: |
        git tag "${{ needs.prepare.outputs.version }}"
        git push origin "${{ needs.prepare.outputs.version }}"

    - name: Publish stable release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.version }}
      run: |
        gh release create "$TAG" \
          --title "$TAG" \
          --notes-file CHANGELOG.md \
          bin/quiver-linux-amd64 \
          bin/quiver-linux-arm64 \
          bin/quiver-darwin-amd64 \
          bin/quiver-darwin-arm64 \
          bin/quiver-windows-amd64.exe \
          bin/checksums.txt

  backport:
    name: Backport to Develop
    needs: [ prepare, publish ]
    uses: ./.github/workflows/backport.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
